version: "3"

vars:
  FRONTEND: frontend

tasks:
  default:
    desc: Run tests and frontend checks
    deps: [test, frontend:check]

  test:
    desc: Run Go tests
    cmds:
      - go test ./internal/...

  lint:
    desc: Run Go linters
    cmds:
      - gofmt -l .
      - go vet ./...
      - golangci-lint run

  frontend:install:
    dir: '{{.FRONTEND}}'
    cmds:
      - npm ci

  frontend:check:
    dir: '{{.FRONTEND}}'
    deps: [frontend:install]
    cmds:
      - npm run typecheck
      - npm run lint
      - npm run format:check
      - npm run build

  ci:
    desc: Checks used in GitHub Actions
    cmds:
      - task: lint
      - task: test
      - task: frontend:check
