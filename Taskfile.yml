version: "3"

vars:
  FRONTEND: frontend

tasks:
  default:
    desc: Run tests and frontend checks
    deps: [test, frontend:check]

  test:
    desc: Run Go tests
    cmds:
      - go test ./internal/...

  build:
    desc: Release build (wails build). Binary in build/bin/
    cmds:
      # Ubuntu 24.04 ships WebKitGTK 4.1. The matching files are behind this tag.
      - cmd: wails build -tags webkit2_41
        platforms: [linux]
      - cmd: wails build
        platforms: [windows, darwin]

  lint:
    desc: Run Go linters
    cmds:
      - gofmt -l .
      - go vet ./...
      - golangci-lint run

  frontend:install:
    dir: '{{.FRONTEND}}'
    cmds:
      - npm ci

  frontend:check:
    dir: '{{.FRONTEND}}'
    deps: [frontend:install]
    cmds:
      - npm run typecheck
      - npm run lint
      - npm run format:check
      - npm run build

  ci:
    desc: Checks used in GitHub Actions
    cmds:
      - task: lint
      - task: test
      - task: frontend:check
