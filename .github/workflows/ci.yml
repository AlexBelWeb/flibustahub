name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Format (Go)
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt needed on:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: |
          packages=$(go list ./... | grep -v node_modules || true)
          go vet $packages

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Test
        run: |
          packages=$(go list ./... | grep -v node_modules || true)
          if [ "${{ runner.os }}" = "Linux" ]; then
            go test -race $packages
          else
            go test $packages
          fi

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend format
        working-directory: frontend
        run: npm run format:check

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: CHANGELOG reminder
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -Eq '^(internal/|frontend/src/)'; then
            if ! git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -q '^CHANGELOG.md$'; then
              if [[ "${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}" != "true" ]]; then
                echo "Code changed without CHANGELOG.md. Add a user-facing note or the no-changelog label."
                exit 1
              fi
            fi
          fi
